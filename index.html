<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D 타워 점프 - 완성판</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* UI 패널 공통 */
    .ui-panel {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* 좌측 상단: 멀티플레이 정보 */
    #info-panel {
      top: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }
    .title-text {
      font-weight: bold;
      font-size: 15px;
      color: #38bdf8;
    }
    .status-text {
      font-weight: 600;
      color: #4ade80;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .ui-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .ui-btn:active {
      background: #0369a1;
    }

    /* 중앙 상단: Floor 선택기 (최소 1층 제한) */
    #floor-panel {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border: 1px solid #22c55e;
    }
    .floor-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .floor-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .floor-btn:active {
      background: #22c55e;
    }
    .floor-title {
      font-size: 16px;
      font-weight: bold;
    }
    .floor-sub {
      font-size: 11px;
      color: #22c55e;
    }

    /* 우측 상단: 카메라 & Lock 버튼 */
    #camera-panel {
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 하단 조이스틱 & 점프 버튼 */
    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      z-index: 10;
      touch-action: none;
    }
    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: #38bdf8;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    #jump-btn {
      position: absolute;
      bottom: 35px;
      right: 30px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
      cursor: pointer;
