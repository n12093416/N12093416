<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>3D 타워 점프 멀티플레이어</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 왼쪽 정보 패널 */
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.65); padding: 10px; border-radius: 10px; z-index: 10; font-size: 12px; pointer-events: none; }
        #room-status { color: #f59e0b; font-weight: bold; margin-top: 4px; }
        #room-controls { margin-top: 8px; display: flex; gap: 6px; pointer-events: auto; }
        .room-btn { background: #0284c7; color: white; border: none; padding: 6px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .room-btn:active { background: #0369a1; }

        /* 👑 상단 타워 스테이지 사이드바 */
        #top-sidebar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 2px solid #10b981; border-radius: 20px;
            display: flex; align-items: center; padding: 5px 15px; color: white; z-index: 20; pointer-events: auto;
        }
        .stage-btn { background: #374151; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; }
        .stage-btn:active { background: #4b5563; }
        #stage-info { margin: 0 15px; font-weight: bold; font-size: 14px; text-align: center; }

        /* 🎥 카메라 모드 & 쉬프트락 */
        #right-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 20; pointer-events: auto; }
        .side-btn { padding: 10px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; color: white; font-weight: bold; font-size: 12px; cursor: pointer; }
        .side-btn.active { background: #0284c7; border-color: #38bdf8; }

        #crosshair { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.8); font-size: 24px; font-weight: bold; z-index: 30; }

        /* 🕹️ 모바일 조작계 */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 20; pointer-events: auto; }
        #joystick-knob { width: 50px; height: 50px; background: rgba(56, 189, 248, 0.8); border-radius: 50%; position: absolute; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }
        #jump-btn { position: absolute; bottom: 35px; right: 35px; width: 70px; height: 70px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; z-index: 20; pointer-events: auto; }
        #jump-btn:active { background: rgba(56, 189, 248, 0.8); transform: scale(0.95); }
        #touch-camera-zone { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; }
    </style>
</head>
<body>

<div id="crosshair">+</div>
<div id="ui">
    <div style="font-weight: bold; margin-bottom: 4px;">🎮 3D 타워 점프</div>
    <div style="font-size: 12px; margin-bottom: 2px;">내 ID: <span id="my-id" style="color: #38bdf8; font-weight: bold;">생성중...</span></div>
    <div>접속자: <span id="player-count">1</span>명</div>
    <div id="room-status">상태: 연결 대기 중</div>
    <div id="room-controls">
        <button class="room-btn" onclick="createRoom()">🏠 방 생성</button>
        <button class="room-btn" onclick="joinRoom()">🔗 방 참가</button>
    </div>
</div>

<div id="top-sidebar">
    <button class="stage-btn" onclick="teleportStage(-1)">◁</button>
    <div id="stage-info">Floor 1<br><span style="font-size:10px; color:#10b981;">Max: 1</span></div>
    <button class="stage-btn" onclick="teleportStage(1)">▷</button>
</div>

<div id="right-controls">
    <button id="cam-toggle-btn" class="side-btn">🎥 3인칭</button>
    <button id="shiftlock-btn" class="side-btn">🔒 Lock OFF</button>
</div>

<div id="touch-camera-zone"></div>
<div id="joystick-zone"><div id="joystick-knob"></div></div>
<div id="jump-btn">점프</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    const floorHeight = 20;
    let peer = null;
    let myData = { id: "", x: 0, y: 2, z: 40, rotY: 0, maxF: 0 };
    let velocityY = 0, gravity = -0.015, jumpStrength = 0.35, isGrounded = false;
    let cameraDistance = 6, rotX = 0.2; 
    let isShiftLock = false, isFirstPerson = false;
    let currentViewFloor = 0, highestFloor = 0, globalMaxFloor = 0;

    const connections = {};
    const otherPlayers = {};
    const platforms = {}; 

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617); 
    scene.fog = new THREE.Fog(0x020617, 20, 80);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x94a3b8, 0.6));

    const grid = new THREE.GridHelper(100, 50, 0x10b981, 0x064e3b);
    scene.add(grid);

    function createPlayerMesh(isMe) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 1), new THREE.MeshStandardMaterial({ color: isMe ? 0x38bdf8 : 0xef4444 }));
        body.position.y = 0.9;
        group.add(body);
        scene.add(group);
        return group;
    }
    const myMesh = createPlayerMesh(true);

    function randomSeed(s) {
        return function() { s = Math.sin(s) * 10000; return s - Math.floor(s); };
    }

    const seaweedMat = new THREE.MeshLambertMaterial({ color: 0x061c0b, side: THREE.DoubleSide });

    function ensureFloorsGenerated(maxF) {
        let targetMax = maxF + 20; 
        for(let i = 0; i <= targetMax; i++) {
            if (!platforms[i]) buildFloor(i);
        }
    }

    function buildFloor(f) {
        platforms[f] = [];
        let baseY = f * floorHeight;

        // 김(Seaweed) 겉면 껍질 (100x100)
        const wallG = new THREE.BoxGeometry(100, floorHeight, 1);
        const wallGSide = new THREE.BoxGeometry(1, floorHeight, 100);
        let w1 = new THREE.Mesh(wallG, seaweedMat); w1.position.set(0, baseY + floorHeight/2, -50);
        let w2 = new THREE.Mesh(wallG, seaweedMat); w2.position.set(0, baseY + floorHeight/2, 50);
        let w3 = new THREE.Mesh(wallGSide, seaweedMat); w3.position.set(-50, baseY + floorHeight/2, 0);
        let w4 = new THREE.Mesh(wallGSide, seaweedMat); w4.position.set(50, baseY + floorHeight/2, 0);
        scene.add(w1, w2, w3, w4);

        // 시작 발판
        let startPad = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 10), new THREE.MeshStandardMaterial({color: 0x3b82f6}));
        startPad.position.set(0, baseY, 40);
        scene.add(startPad);
        platforms[f].push(startPad);

        // 🟢 첫 번째 점프 거리를 좁혀주기 위한 추가 발판 배치 (z: 26 위치)
        let firstExtraPad = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 5), new THREE.MeshStandardMaterial({color: 0xf59e0b}));
        firstExtraPad.position.set(0, baseY, 26);
        scene.add(firstExtraPad);
        platforms[f].push(firstExtraPad);

        // 도착(점프) 발판
        let endPad = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 10), new THREE.MeshStandardMaterial({color: 0x10b981}));
        endPad.position.set(0, baseY, -40);
        endPad.userData.isJumpPad = true; 
        scene.add(endPad);
        platforms[f].push(endPad);

        let levelPattern = f < 20 ? f : Math.floor(randomSeed((f+1)*777)() * 20); 
        let diff = (levelPattern % 20) + 1; 
        
        let rng = randomSeed(levelPattern * 1234);
        let numSteps = 5 + Math.floor(diff * 0.4); 
        let zStep = 60 / numSteps;

        for(let i = 1; i < numSteps; i++) {
            let size = Math.max(1.5, 6 - (diff * 0.15)); 
            let pMesh = new THREE.Mesh(new THREE.BoxGeometry(size, 1, size), new THREE.MeshStandardMaterial({color: 0xf59e0b}));
            
            let px = (rng() - 0.5) * 40; 
            let pz = 18 - (i * zStep); // 첫 발판 이후부터 랜덤 배치 이어지도록 조정
            let py = baseY + (rng() * 1.5); 
            pMesh.position.set(px, py, pz);
            scene.add(pMesh);
            platforms[f].push(pMesh);
        }
    }

    ensureFloorsGenerated(0);

    function initPeer(customId) {
        try {
            if (peer) peer.destroy();
            peer = customId ? new Peer(customId) : new Peer();

            peer.on('open', function(id) {
                myData.id = id;
                document.getElementById("my-id").innerText = id;
                document.getElementById("room-status").innerText = "서버 접속 성공 🟢";
            });

            peer.on('connection', setupConnection);
            peer.on('error', function(err) {
                document.getElementById("room-status").innerText = "단독 플레이 모드";
            });
        } catch (e) {
            document.getElementById("room-status").innerText = "단독 플레이 모드";
        }
    }
    
    setTimeout(function() { initPeer(); }, 500);

    function setupConnection(conn) {
        conn.on('open', function() {
            connections[conn.peer] = conn;
            document.getElementById("room-status").innerText = "멀티 연결됨! 🎮";
        });
        conn.on('data', function(data) {
            if (!otherPlayers[data.id]) otherPlayers[data.id] = createPlayerMesh(false);
            
            const mesh = otherPlayers[data.id];
            mesh.position.set(data.x, data.y, data.z);
            mesh.rotation.y = data.rotY;

            if (data.maxF > globalMaxFloor) {
                globalMaxFloor = data.maxF;
                ensureFloorsGenerated(globalMaxFloor);
            }
            document.getElementById("player-count").innerText = Object.keys(otherPlayers).length + 1;
        });
        conn.on('close', function() {
            if (otherPlayers[conn.peer]) { scene.remove(otherPlayers[conn.peer]); delete otherPlayers[conn.peer]; }
            delete connections[conn.peer];
            document.getElementById("player-count").innerText = Object.keys(otherPlayers).length + 1;
        });
    }

    window.createRoom = function() {
        const code = "TOWER" + Math.floor(1000 + Math.random() * 9000);
        initPeer(code);
        alert("방 코드: [ " + code + " ]\n친구에게 코드를 알려주세요!");
    };
    window.joinRoom = function() {
        const code = prompt("방 코드 입력 (예: TOWER1234):");
        if (code && peer) setupConnection(peer.connect(code.trim()));
    };

    window.teleportStage = function(dir) {
        let target = currentViewFloor + dir;
        if (target >= 0 && target <= highestFloor) {
            currentViewFloor = target;
            myData.y = target * floorHeight + 2;
            myData.x = 0; myData.z = 40; 
            velocityY = 0;
            updateStageUI();
        }
    };

    function updateStageUI() {
        document.getElementById("stage-info").innerHTML = "Floor " + (currentViewFloor + 1) + "<br><span style='font-size:10px; color:#10b981;'>Max: " + (highestFloor + 1) + "</span>";
    }

    document.getElementById("cam-toggle-btn").addEventListener("click", function() {
        isFirstPerson = !isFirstPerson;
        this.innerText = isFirstPerson ? "🎥 1인칭" : "🎥 3인칭";
        myMesh.visible = !isFirstPerson;
    });

    document.getElementById("shiftlock-btn").addEventListener("click", function() {
        isShiftLock = !isShiftLock;
        this.innerText = isShiftLock ? "🔒 Lock ON" : "🔒 Lock OFF";
        if(isShiftLock) this.classList.add("active"); else this.classList.remove("active");
        document.getElementById("crosshair").style.display = isShiftLock ? "block" : "none";
    });

    document.getElementById("jump-btn").addEventListener("touchstart", function(e) {
        e.preventDefault(); e.stopPropagation(); 
        if (isGrounded) { velocityY = jumpStrength; isGrounded = false; }
    }, { passive: false });

    let moveF = 0, moveS = 0, joyId = null, jStartX = 0, jStartY = 0;
    const joyZone = document.getElementById("joystick-zone"), joyKnob = document.getElementById("joystick-knob");

    joyZone.addEventListener("touchstart", function(e) {
        e.preventDefault();
        if (joyId !== null) return;
        joyId = e.changedTouches[0].identifier;
        jStartX = e.changedTouches[0].clientX; 
        jStartY = e.changedTouches[0].clientY;
    }, { passive: false });

    window.addEventListener("touchmove", function(e) {
        let touch = null;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === joyId) { touch = e.touches[i]; break; }
        }
        if (touch) {
            let dx = touch.clientX - jStartX, dy = touch.clientY - jStartY;
            let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45); 
            let angle = Math.atan2(dy, dx);
            joyKnob.style.transform = "translate(" + (Math.cos(angle)*dist) + "px, " + (Math.sin(angle)*dist) + "px)";
            moveF = -Math.sin(angle) * (dist/45); 
            moveS = -Math.cos(angle) * (dist/45);
        }
    }, { passive: false });

    function resetJoy(e) {
        let found = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyId) found = true;
        }
        if (found) {
            joyId = null; 
            joyKnob.style.transform = "translate(0px, 0px)"; 
            moveF = 0; moveS = 0;
        }
    }
    window.addEventListener("touchend", resetJoy);
    window.addEventListener("touchcancel", resetJoy);

    let camId = null, lastCamX = 0, lastCamY = 0;
    document.getElementById("touch-camera-zone").addEventListener("touchstart", function(e) {
        e.preventDefault(); 
        for(let i=0; i<e.changedTouches.length; i++) {
            let target = e.changedTouches[i].target;
            if (camId === null && target.id === "touch-camera-zone") {
                camId = e.changedTouches[i].identifier;
                lastCamX = e.changedTouches[i].clientX; 
                lastCamY = e.changedTouches[i].clientY;
            }
        }
    }, { passive: false });

    window.addEventListener("touchmove", function(e) {
        let touch = null;
        for(let i=0; i<e.touches.length; i++) {
            if(e.touches[i].identifier === camId) { touch = e.touches[i]; break; }
        }
        if (touch) {
            let dx = touch.clientX - lastCamX, dy = touch.clientY - lastCamY;
            myData.rotY -= dx * 0.005;
            rotX -= dy * 0.005; 
            rotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, rotX));
            lastCamX = touch.clientX; lastCamY = touch.clientY;
        }
    }, { passive: false });

    window.addEventListener("touchend", function(e) {
        let found = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === camId) found = true;
        }
        if (found) camId = null;
    });

    let lastSend = 0;
    function animate() {
        requestAnimationFrame(animate);

        const speed = 0.15;
        let nextX = myData.x - (Math.sin(myData.rotY) * moveF + Math.cos(myData.rotY) * moveS) * speed;
        let nextZ = myData.z - (Math.cos(myData.rotY) * moveF - Math.sin(myData.rotY) * moveS) * speed;
        
        nextX = Math.max(-49, Math.min(49, nextX));
        nextZ = Math.max(-49, Math.min(49, nextZ));

        velocityY += gravity;
        let nextY = myData.y + velocityY;
        
        let checkFloor = Math.floor(myData.y / floorHeight);
        let arr1 = platforms[checkFloor] || [];
        let arr2 = platforms[checkFloor-1] || [];
        let checkPlats = arr1.concat(arr2);
        
        let grounded = false;
        let launchPad = false;

        for (let i = 0; i < checkPlats.length; i++) {
            let p = checkPlats[i];
            let hW = p.geometry.parameters.width / 2;
            let hD = p.geometry.parameters.depth / 2;
            let px = p.position.x, py = p.position.y, pz = p.position.z;

            if (nextX > px - hW - 0.5 && nextX < px + hW + 0.5 &&
                nextZ > pz - hD - 0.5 && nextZ < pz + hD + 0.5) {
                if (velocityY <= 0 && myData.y >= py - 0.5 && nextY <= py + 0.5) {
                    nextY = py + 0.5; velocityY = 0; grounded = true;
                    if (p.userData.isJumpPad) launchPad = true; 
                }
            }
        }

        if (launchPad) { velocityY = 0.85; grounded = false; }

        // 🟢 현재 층 기준 -2층 높이보다 낮아지면(아래로 2개 층 이상 떨어지면) 현재 층의 첫 발판으로 텔레포트
        if (nextY < (checkFloor - 2) * floorHeight) {
            nextY = checkFloor * floorHeight + 2; 
            nextX = 0; 
            nextZ = 40; 
            velocityY = 0;
        }

        myData.x = nextX; myData.y = nextY; myData.z = nextZ; isGrounded = grounded;
        myMesh.position.set(myData.x, myData.y, myData.z);
        myMesh.rotation.y = myData.rotY;

        let nowFloor = Math.floor(myData.y / floorHeight);
        if (nowFloor > highestFloor) {
            highestFloor = nowFloor;
            if (highestFloor > globalMaxFloor) { globalMaxFloor = highestFloor; ensureFloorsGenerated(globalMaxFloor); }
        }
        if (currentViewFloor !== nowFloor && nowFloor <= highestFloor) {
            currentViewFloor = nowFloor; updateStageUI();
        }

        if (isFirstPerson) {
            camera.position.set(myData.x, myData.y + 1.5, myData.z);
            let dX = Math.cos(rotX) * -Math.sin(myData.rotY), dY = Math.sin(rotX), dZ = Math.cos(rotX) * -Math.cos(myData.rotY);
            camera.lookAt(myData.x + dX, myData.y + 1.5 + dY, myData.z + dZ);
        } else {
            let cx = myData.x + Math.sin(myData.rotY) * Math.cos(rotX) * cameraDistance;
            let cy = myData.y + 1.5 + Math.sin(rotX) * cameraDistance;
            let cz = myData.z + Math.cos(myData.rotY) * Math.cos(rotX) * cameraDistance;
            camera.position.set(cx, cy, cz);
            camera.lookAt(myData.x, myData.y + 1.5, myData.z);
        }

        myData.maxF = highestFloor;
        const now = Date.now();
        if (now - lastSend > 33) {
            for (let key in connections) {
                if (connections.hasOwnProperty(key)) {
                    let conn = connections[key];
                    if (conn && conn.open) conn.send(myData);
                }
            }
            lastSend = now;
        }
        renderer.render(scene, camera);
    }
    
    animate();

    window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
